spring.application.name=pedido
server.port=8086

# =====================
# MYSQL
# =====================
spring.datasource.url=jdbc:mysql://localhost:3316/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# =====================
# FLYWAY
# =====================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# =====================
# EUREKA
# =====================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =====================
# ACTUATOR
# =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================
# LOGGING
# =====================
logging.level.root=INFO
logging.level.cl.duoc.pedido=DEBUG
logging.file.name=logs/pedido.log

# =====================
# SWAGGER
# =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# =====================
# JACKSON
# =====================
spring.jackson.serialization.fail-on-empty-beans=false