spring.application.name=notificaciones

server.port= 8089

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3319/notifications_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: desactivar creación automática de tablas
spring.jpa.hibernate.ddl-auto=update

# Dialecto recomendado para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Flyway: habilitar migraciones
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration