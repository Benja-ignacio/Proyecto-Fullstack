spring.application.name=feedback
# Configuración de la base de datos MySQL para el microservicio 'feedback'

# URL de conexión a la base de datos MySQL.
# Asegúrate de que 'localhost:3306' sea la dirección y puerto correctos de tu servidor MySQL.
# 'feedback_db' es el nombre de la base de datos que debes haber creado en MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/feedback_db?useSSL=false&serverTimezone=UTC
# Reemplaza con tu usuario de MySQL
spring.datasource.username=root
# Reemplaza con tu contraseña de MySQL
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate (opcional, pero útil para desarrollo)
spring.jpa.hibernate.ddl-auto=update # 'update' intentará actualizar el esquema de la BD.
                                     # Para producción, considera 'validate' o 'none'.
spring.jpa.show-sql=true
