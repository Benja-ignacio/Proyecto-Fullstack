server:
  port: 8082

spring:
  application:
    name: cart

  datasource:
    url: jdbc:mysql://mysql-cart:3306/cart_db
    username: aurastore
    password: aurastore123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      dll-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

#eureka
eureka:
  client:
    service-url.defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

#actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Logs
logging:
  file:
    name: /app/logs/${spring.application.name}/${spring.application.name}.log

  logback:
    rollingpolicy:
      max-file-size: 10mb
      max-history: 10
