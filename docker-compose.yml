version: "3.8"

services:
  # 1. USERS
  mysql-users:
    image: mysql:8.0
    container_name: mysql_users
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
      MYSQL_USER: aurastore
      MYSQL_PASSWORD: aurastore123
    ports:
      - "3310:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql

  users-service:
    build:
      context: ./users/users
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mysql-users

  # 2. PRODUCTS
  mysql-products:
