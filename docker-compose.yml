version: '3.8'

services:

  # 1. CARRITO
  mysql-carrito:
    image: mysql:8.0
    container_name: mysql_carrito
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carrito_db
      MYSQL_USER: aurastore
      MYSQL_PASSWORD: aurastore123
    ports:
      - "3311:3306"
    volumes:
      - mysql_carrito_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 350M

  carrito-service:
    build:
      context: ./carrito/carrito
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - mysql-carrito
    deploy:
      resources:
        limits:
          memory: 450M

