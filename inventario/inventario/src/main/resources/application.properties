spring.application.name=inventory

server.port=8084

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://mysql-inventory:3306/inventory_db
spring.datasource.username=aurastore
spring.datasource.password=aurastore123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: desactivar creación automática de tablas
spring.jpa.hibernate.ddl-auto=none

# Dialecto recomendado para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway: habilitar migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuración de Eureka Client
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always